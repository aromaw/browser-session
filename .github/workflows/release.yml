name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gui:
    uses: ./.github/workflows/gui.yml
    with:
      version: ${{ github.ref_name }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race -count=1 -timeout=5m ./...
  release:
    needs: [test, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-session-gui-*
          merge-multiple: true
          path: dist
      - name: Build archives and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            export GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0
            stage="dist/$target"
            mkdir -p "$stage"
            name=browser-session
            if [ "$GOOS" = windows ]; then name=browser-session.exe; fi
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$stage/$name" ./cmd/browser-session
            cp LICENSE README.md "$stage/"
            if [ "$GOOS" = windows ]; then
              (cd "$stage" && zip -q "../browser-session-$VERSION-$target.zip" "$name" LICENSE README.md)
            else
              tar -czf "dist/browser-session-$VERSION-$target.tar.gz" -C "$stage" "$name" LICENSE README.md
            fi
          done
          mkdir -p dist/extension
          cp extension/manifest.json extension/background.js extension/request.js extension/setup.html extension/setup.js extension/setup.css dist/extension/
          (cd dist && zip -qr "browser-session-extension-$VERSION.zip" extension)
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --draft --title "$VERSION" --generate-notes
